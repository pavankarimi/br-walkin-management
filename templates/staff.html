{% extends "base.html" %}{% block content %}<h1 class="h2">Staff Accounts</h1><div class="row g-4"><div class="col-lg-5"><div class="card border-0 shadow-sm"><div class="card-body p-4"><h2 class="h5">Create staff account</h2><form method="post"><label class="form-label">Full name</label><input name="name" class="form-control mb-2" required><label class="form-label">Email</label><input name="email" type="email" class="form-control mb-2" required><label class="form-label">Phone</label><input name="phone" class="form-control mb-2" required><label class="form-label">Temporary password (10+ characters)</label><input name="password" type="password" minlength="10" class="form-control mb-3" required><button class="btn btn-primary w-100">Create account</button></form></div></div></div><div class="col-lg-7"><div class="table-responsive"><table class="table"><thead><tr><th>Name</th><th>Assigned</th><th>Status</th><th></th></tr></thead><tbody>{% for s in staff %}<tr><td>{{s.name}}<div class="small text-muted">{{s.email}}</div></td><td>{{s.students|length}}</td><td>{{'Active' if s.active else 'Inactive'}}</td><td><form method="post" action="{{url_for('toggle_staff',staff_id=s.id)}}"><button class="btn btn-sm btn-outline-secondary">{{'Deactivate' if s.active else 'Activate'}}</button></form></td></tr>{% endfor %}</tbody></table></div></div></div>{% endblock %}
