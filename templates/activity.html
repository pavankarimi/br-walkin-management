{% extends "base.html" %}{% block content %}<h1 class="h2">Team Activity Log</h1><div class="table-responsive"><table class="table"><thead><tr><th>Date / Time</th><th>Actor</th><th>Action</th><th>Details</th></tr></thead><tbody>{% for x in logs %}<tr><td>{{x.created_at.strftime('%d-%m-%Y %I:%M %p')}}</td><td>{{x.actor}}</td><td>{{x.action}}</td><td>{{x.details}}</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
