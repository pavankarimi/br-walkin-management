{% extends "base.html" %}{% block content %}<h1 class="h2">Student Records</h1><form class="row g-2 mb-3"><div class="col-md-6"><input name="q" class="form-control" placeholder="Search name, phone or registration ID" value="{{request.args.get('q','')}}"></div><div class="col-md-3"><select name="status" class="form-select"><option value="">All statuses</option>{% for x in ['New','Contacted','Follow-up','Interested','Enrolled','Not Interested'] %}<option {% if request.args.get('status')==x %}selected{% endif %}>{{x}}</option>{% endfor %}</select></div><div class="col-md-3"><button class="btn btn-primary w-100">Filter</button></div></form><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Registration</th><th>Student</th><th>Phone</th><th>Reference staff</th><th>Program</th><th>Status</th></tr></thead><tbody>{% for s in students %}<tr><td><a href="{{url_for('student_detail',student_id=s.id)}}">{{s.registration_id}}</a></td><td>{{s.full_name}}</td><td>{{s.phone}}</td><td>{{s.staff.name}}</td><td>{{s.course_interest}}</td><td>{{s.status}}</td></tr>{% else %}<tr><td colspan="6">No matching records.</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
